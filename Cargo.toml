[workspace]
members = [
    "crates/use-validate",
    "crates/use-check",
    "crates/use-rule",
    "crates/use-range",
    "crates/use-bound",
    "crates/use-constraint",
    "crates/use-predicate",
]
resolver = "2"

[workspace.package]
authors = ["RustUse Contributors"]
edition = "2024"
homepage = "https://rustuse.org"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/RustUse/use-validate"
rust-version = "1.95.0"
version = "0.0.1"

[workspace.metadata.rustuse.release]
publish = false
versioning = "lockstep-0.x"
first-publish-candidates = [
    "use-check",
    "use-rule",
    "use-range",
    "use-bound",
    "use-constraint",
    "use-predicate",
    "use-validate",
]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"